; 脉冲 Pulse · StackChan 固件
; 编译并上传：pio run -e m5stack-cores3 -t upload   （Core2 用 m5stack-core2，Basic/Gray/Fire 用 m5stack-core-esp32）
[platformio]
src_dir = PulseStackChan
default_envs = m5stack-cores3

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps =
  m5stack/M5Unified@0.2.28
  m5stack/M5GFX@0.2.35
  bblanchon/ArduinoJson@6.21.6
  links2004/WebSockets@2.6.1
build_flags = -O2

[env:m5stack-cores3]
board = m5stack-cores3
extra_scripts =
  pre:tools/network_client_build.py
  post:tools/camera_driver_build.py
build_flags = ${env.build_flags} -DPULSE_FACE_FOLLOW=1 -DPULSE_STUDIO_VOICE=1
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

[env:m5stack-core2]
board = m5stack-core2
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

[env:m5stack-core-esp32]
board = m5stack-core-esp32
board_build.partitions = huge_app.csv
