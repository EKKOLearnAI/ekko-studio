name: E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - base
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild node-pty

      - name: Install Playwright browser
        run: |
          if find tests/e2e -type f \( -name '*.spec.*' -o -name '*.test.*' \) -print -quit | grep -q .; then
            npx playwright install --with-deps chromium
          fi

      - name: Run Playwright tests
        env:
          STUDIO_TASK_ARTIFACTS_DIR: ${{ runner.temp }}/studio-artifacts
        run: npm run test:e2e -- --reporter=list,html

      - name: Upload browser test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            ${{ runner.temp }}/studio-artifacts/playwright-html/
            ${{ runner.temp }}/studio-artifacts/playwright-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Check task artifact locations
        if: ${{ !cancelled() }}
        run: npm run artifacts:check
