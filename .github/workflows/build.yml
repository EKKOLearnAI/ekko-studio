name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - base
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Include all packaging integration tests
        type: choice
        options: [full, core]
        default: full

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Select regression scope
        id: scope
        run: node scripts/ci-test-scope.mjs

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild node-pty

      - name: Check repository harness
        run: npm run harness:check

      - name: Test with coverage
        env:
          INCLUDE_PACKAGING: ${{ steps.scope.outputs.packaging }}
        run: |
          if [ "$INCLUDE_PACKAGING" = true ]; then
            npm run test:coverage
          else
            npm run test:coverage:core
          fi

      - name: Build
        run: npm run build
