name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to npm"
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Validate release version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs')
          const { name, version, private: isPrivate } = require('./package.json')
          if (name !== 'hermes-web-ui' || isPrivate) {
            throw new Error('Expected the public hermes-web-ui package')
          }
          if (![version, `v${version}`].includes(process.env.RELEASE_TAG)) {
            throw new Error(`Release tag must match package version ${version}`)
          }
          const prerelease = version.includes('-') || process.env.RELEASE_PRERELEASE === 'true'
          appendFileSync(process.env.GITHUB_OUTPUT, `dist_tag=${prerelease ? 'next' : 'latest'}\n`)
          NODE

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild node-pty

      - name: Check repository harness
        run: npm run harness:check

      - name: Build package
        run: npm run build

      - name: Pack and verify published files
        id: package
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/npm-package" > "$RUNNER_TEMP/npm-package/manifest.json"
          node <<'NODE'
          const { readFileSync, appendFileSync } = require('node:fs')
          const { join } = require('node:path')
          const dir = join(process.env.RUNNER_TEMP, 'npm-package')
          const [pkg] = JSON.parse(readFileSync(join(dir, 'manifest.json'), 'utf8'))
          const files = new Set(pkg.files.map(file => file.path))
          const metadata = require('./package.json')
          const required = ['package.json', 'LICENSE', 'dist/client/index.html', 'dist/server/index.js',
            ...Object.values(metadata.bin).map(path => path.replace(/^\.\//, ''))]
          for (const path of required) {
            if (!files.has(path)) throw new Error(`Missing npm package file: ${path}`)
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${join(dir, pkg.filename)}\n`)
          console.log(`Verified ${pkg.filename}: ${pkg.files.length} files`)
          NODE

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN repository secret is not configured" >&2
            exit 1
          fi
          npm publish "$PACKAGE_TARBALL" --access public --tag "$NPM_DIST_TAG" --ignore-scripts --registry https://registry.npmjs.org
