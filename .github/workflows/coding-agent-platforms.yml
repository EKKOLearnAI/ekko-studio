name: Coding agent platforms

on:
  pull_request:
    branches: [main, base]
    paths:
      - 'packages/server/src/**'
      - 'tests/server/**'
      - 'tests/setup.ts'
      - 'package*.json'
      - 'vitest.config.ts'
      - '.github/workflows/coding-agent-platforms.yml'
  push:
    branches: [main]
    paths:
      - 'packages/server/src/**'
      - 'tests/server/**'
      - 'tests/setup.ts'
      - 'package*.json'
      - 'vitest.config.ts'
      - '.github/workflows/coding-agent-platforms.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coding-agent-platforms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-processes:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      NODE_ENV: test
      PORT: 8648
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build PTY dependency
        run: npm rebuild node-pty
      - name: Verify command discovery, environment checks and real child processes
        run: >-
          npm run test --
          tests/server/native-coding-agent-environment.test.ts
          tests/server/native-coding-agent-platform-process.test.ts
          tests/server/coding-agents-windows-execution.test.ts
          tests/server/zcode-desktop-command.test.ts
          tests/server/native-chat-turn.test.ts
          --maxWorkers=1 --testTimeout=30000
